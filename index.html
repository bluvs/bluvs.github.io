<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bluvs::terminal::v2.1</title>
    <style>
        :root {
            --bg-color: #080a0f;
            --text-color: #d1d9e1;
            --prompt-color: #58a6ff;
            --path-color: #3fb950;
            --cmd-color: #ffffff;
            --output-color: #8b949e;
            --ascii-color: #3fb950;
            --border-color: #1f242c;
            --font-stack: 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --glow-color: rgba(63, 185, 80, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-stack);
            font-size: 14px;
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.15;
        }

        #terminal-window {
            width: 95%;
            height: 90%;
            max-width: 1000px;
            max-height: 700px;
            background-color: rgba(13, 17, 23, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px var(--glow-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        #title-bar {
            height: 32px;
            background-color: #161b22;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 12px;
            user-select: none;
        }

        .buttons {
            display: flex;
            gap: 6px;
        }

        .button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        #title {
            flex: 1;
            text-align: center;
            color: var(--output-color);
            font-size: 12px;
            font-weight: bold;
        }

        #terminal-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        #terminal-content::-webkit-scrollbar {
            width: 6px;
        }

        #terminal-content::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 3px;
        }

        .ascii {
            color: var(--ascii-color);
            font-weight: bold;
            line-height: 1.15;
            margin: 10px 0;
            font-size: 9px;
            white-space: pre;
            text-shadow: 0 0 5px var(--glow-color);
            overflow-x: auto;
        }

        @media (min-width: 600px) {
            .ascii { font-size: 11px; }
            font-size: 15px;
        }

        .system-message {
            color: var(--output-color);
            margin-bottom: 6px;
            border-left: 2px solid var(--border-color);
            padding-left: 10px;
        }

        .line {
            margin-bottom: 6px;
            word-break: break-word;
            display: flex;
            align-items: flex-start;
        }

        .prompt { color: var(--prompt-color); white-space: nowrap; }
        .path { color: var(--path-color); }
        .cmd { color: var(--cmd-color); font-weight: bold; margin-left: 6px; }

        .output {
            color: var(--output-color);
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 2px solid transparent;
            padding-left: 10px;
            transition: border-color 0.2s;
        }
        
        .output:hover {
            border-color: var(--border-color);
            color: var(--text-color);
        }

        .error {
            color: #ff6b6b;
        }

        .input-form {
            display: flex;
            align-items: center;
            margin-top: auto;
            padding-bottom: 5px;
            width: 100%;
        }

        .prompt-symbol {
            white-space: nowrap;
            user-select: none;
            display: flex;
            align-items: center;
        }

        input {
            background: transparent;
            border: none;
            color: var(--cmd-color);
            font-family: var(--font-stack);
            font-size: 16px;
            outline: none;
            flex: 1;
            margin-left: 6px;
            padding: 0;
            border-radius: 0;
            caret-color: var(--ascii-color);
        }

        a {
            color: var(--prompt-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--prompt-color);
        }

        a:hover {
            color: var(--path-color);
            border-bottom-style: solid;
        }
    </style>
</head>
<body>

<div id="terminal-window">
    <div id="title-bar">
        <div class="buttons">
            <div class="button red"></div>
            <div class="button yellow"></div>
            <div class="button green"></div>
        </div>
        <div id="title">bluvs@dev:~</div>
    </div>
    
    <div id="terminal-content">
        <!-- Główny baner generowany dynamicznie z animacją -->
        <div id="banner"></div>

        <!-- Historia komend -->
        <div id="history"></div>

        <form id="cli-form" class="input-form" action="javascript:void(0);" style="display: none;">
            <span class="prompt-symbol"><span class="prompt">bluvs@dev</span>:<span class="path">~</span>$</span>
            <input type="text" id="cli" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        </form>
    </div>
</div>

<script>
    // =========================================================================
    // EDYTUJ TUTAJ (USTAWIENIA PRĘDKOŚCI ANIMACJI)
    // =========================================================================
    // Prędkość wypisywania tekstu sekwencji startowej (bootowania) w milisekundach na znak (np. 15 = szybciej, 40 = wolniej)
    const BOOT_CHAR_SPEED = 12; // EDYTUJ TUTAJ

    // Prędkość wypisywania tekstu po wywołaniu komend użytkownika w milisekundach na znak
    const TYPING_SPEED = 8; // EDYTUJ TUTAJ
    // =========================================================================

    const cli = document.getElementById('cli');
    const history = document.getElementById('history');
    const content = document.getElementById('terminal-content');
    const cliForm = document.getElementById('cli-form');
    const banner = document.getElementById('banner');

    let isTyping = false;

    const files = {
        'about.md': `## O MNIE
Kreatywny Fullstack Developer z pasją do tworzenia wydajnych aplikacji webowych i optymalizacji architektury systemów.
Specjalizuję się w JavaScript/TypeScript (React, Node.js) oraz rozwiązaniach chmurowych.`,

        'stack.txt': `## TECHNOLOGIE
- **Frontend**: React, Next.js, Vue.js, TypeScript, TailwindCSS
- **Backend**: Node.js, Express, NestJS, Python (FastAPI)
- **Database**: PostgreSQL, MongoDB, Redis
- **DevOps/Tools**: Docker, AWS, CI/CD, Git, Linux`,

        'projects.md': `## PROJEKTY
1. **[E-commerce Platform]** - Skalowalna platforma sprzedażowa.
2. **[Real-time Chat App]** - Aplikacja do czatowania w czasie rzeczywistym.
3. **[bluvs.is-a.dev]** - Interaktywne portfolio terminalowe.`,

        'contact.txt': `## KONTAKT
- **GitHub**: https://github.com/bluvs
- **Email**: kontakt@example.com`
    };

    const asciiBanner = `██████╗ ██╗     ██╗   ██╗██╗   ██╗███████╗
██╔══██╗██║     ██║   ██║██║   ██║██╔════╝
██████╔╝██║     ██║   ██║██║   ██║███████╗
██╔══██╗██║     ██║   ██║╚██╗ ██╔╝╚════██║
██████╔╝███████╗╚██████╔╝ ╚████╔╝ ███████║
╚═════╝ ╚══════╝ ╚═════╝   ╚═══╝  ╚══════╝`;

    const bootSequence = [
        { type: 'msg', text: 'Booting bluvs::terminal v2.1...' },
        { type: 'msg', text: 'Connecting to Core::API... [OK]' },
        { type: 'msg', text: 'Loading virtual filesystem...' },
        { type: 'msg', text: '  -> Loading about.md... [OK]' },
        { type: 'msg', text: '  -> Loading stack.txt... [OK]' },
        { type: 'msg', text: '  -> Loading projects.md... [OK]' },
        { type: 'msg', text: '  -> Loading contact.txt... [OK]' },
        { type: 'ascii', text: asciiBanner },
        { type: 'sub', text: 'Fullstack Developer :: Solutions Architect' },
        { type: 'msg', text: 'Wpisz help, aby zobaczyć dostępne polecenia, lub ls, aby wylistować wirtualne pliki.' }
    ];

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function typeText(element, text, speed) {
        for (let i = 0; i < text.length; i++) {
            element.textContent += text.charAt(i);
            scrollToBottom();
            await sleep(speed);
        }
    }

    async function runBootSequence() {
        isTyping = true;
        for (const item of bootSequence) {
            if (item.type === 'msg') {
                const div = document.createElement('div');
                div.className = 'system-message';
                if (item.text.includes('help')) {
                    div.innerHTML = 'Wpisz <span class="cmd">help</span>, aby zobaczyć dostępne polecenia, lub <span class="cmd">ls</span>, aby wylistować wirtualne pliki.';
                    banner.appendChild(div);
                } else {
                    banner.appendChild(div);
                    await typeText(div, item.text, BOOT_CHAR_SPEED);
                }
            } else if (item.type === 'ascii') {
                const pre = document.createElement('pre');
                pre.className = 'ascii';
                banner.appendChild(pre);
                pre.textContent = item.text;
                scrollToBottom();
            } else if (item.type === 'sub') {
                const sub = document.createElement('div');
                sub.style.color = '#3fb950';
                sub.style.fontWeight = 'bold';
                sub.style.marginBottom = '10px';
                banner.appendChild(sub);
                await typeText(sub, item.text, BOOT_CHAR_SPEED);
            }
            await sleep(50);
        }
        cliForm.style.display = 'flex';
        cli.focus();
        isTyping = false;
    }

    function getDeviceType() {
        const ua = navigator.userAgent;
        if (/iPhone/i.test(ua)) return 'iPhone';
        if (/iPad/i.test(ua)) return 'iPad';
        if (/Android/i.test(ua)) return 'Android';
        if (/Macintosh/i.test(ua)) return 'Macintosh';
        if (/Windows/i.test(ua)) return 'Windows PC';
        if (/Linux/i.test(ua)) return 'Linux Machine';
        return 'Web Client';
    }

    async function fetchNetworkInfo() {
        printOutput("Fetching network interfaces...");
        try {
            const res = await fetch('https://ipapi.co/json/');
            if (!res.ok) throw new Error();
            const data = await res.json();
            
            const ip = data.ip || 'Unknown';
            const org = data.org || 'Unknown Provider';
            const country = data.country_name || 'Unknown Location';
            
            const orgLower = org.toLowerCase();
            const isVpn = orgLower.includes('vpn') || orgLower.includes('hosting') || orgLower.includes('cloud') || orgLower.includes('datacenter');
            const isTor = orgLower.includes('tor') || orgLower.includes('exit-node');

            const outputText = `eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500
        inet ${ip}  netmask 255.255.255.0  broadcast ${ip}
        location: ${country} (${org})
        VPN Detected: ${isVpn ? 'YES [POSITIVE]' : 'NO [NEGATIVE]'}
        TOR Detected: ${isTor ? 'YES [POSITIVE]' : 'NO [NEGATIVE]'}
        status: active`;

            await printAnimatedOutput(outputText);
        } catch (e) {
            printError("ifconfig: Failed to retrieve public IP network interfaces.");
        }
    }

    const commands = {
        'help': () => printAnimatedOutput(`Dostępne polecenia:
  ls           - Wylistuj dostępne pliki
  cat <plik>   - Wyświetl zawartość pliku (np. cat about.md)
  ifconfig     - Sprawdź adres IP oraz wykrywanie VPN / Tor
  neofetch     - Pokaż specyfikację Twojego urządzenia
  whoami       - Wyświetl bieżącego użytkownika
  clear        - Wyczyść historię terminala
  help         - Pokaż pomoc`),
        
        'ls': () => printAnimatedOutput(Object.keys(files).join('  ')),
        
        'whoami': () => printAnimatedOutput('bluvs - Core Developer & Architect'),
        
        'ifconfig': () => fetchNetworkInfo(),
        'ipconfig': () => fetchNetworkInfo(),
        
        'neofetch': () => {
            const device = getDeviceType();
            const screenRes = `${window.screen.width * window.devicePixelRatio}x${window.screen.height * window.devicePixelRatio}`;
            const viewport = `${window.innerWidth}x${window.innerHeight}`;
            const uptime = `${Math.floor(performance.now() / 1000)}s`;

            const logo = [
                "   .--.   ",
                "  |o_o |  ",
                "  |:_/ |  ",
                " //   \\ \\ ",
                "(|     |) ",
                "/'\\_   _/‘\\",
                "\\___)=(___/"
            ];

            const info = [
                `OS: bluvs::Linux v2.1`,
                `User Device: ${device}`,
                `Resolution: ${screenRes}`,
                `Viewport: ${viewport}`,
                `Shell: bash 5.1-web`,
                `Terminal: ${device} Web`,
                `Uptime: ${uptime}`,
                `Host: bluvs.github.io`
            ];

            let formatted = "";
            const maxLines = Math.max(logo.length, info.length);
            for (let i = 0; i < maxLines; i++) {
                const l = logo[i] || "          ";
                const inf = info[i] || "";
                formatted += `${l}   ${inf}\n`;
            }

            printAnimatedOutput(formatted);
        },
        
        'cat': (arg) => {
            if (!arg) {
                printError('cat: podaj nazwę pliku, np. "cat about.md"');
            } else if (files[arg]) {
                printAnimatedOutput(files[arg]);
            } else {
                printError(`cat: ${arg}: Nie ma takiego pliku.`);
            }
        },
        
        'clear': () => {
            history.innerHTML = '';
        }
    };

    cliForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        if (isTyping) return;

        const rawInput = cli.value.trim();
        if (!rawInput) return;

        const parts = rawInput.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const arg = parts[1];

        const line = document.createElement('div');
        line.className = 'line';
        line.innerHTML = `<span class="prompt">bluvs@dev</span>:<span class="path">~</span>$ <span class="cmd">${escapeHtml(rawInput)}</span>`;
        history.appendChild(line);

        cli.value = '';

        if (commands[cmd]) {
            await commands[cmd](arg);
        } else {
            printError(`bash: command not found: ${cmd}. Wpisz 'help'.`);
        }

        scrollToBottom();
    });

    async function printAnimatedOutput(text) {
        isTyping = true;
        const out = document.createElement('div');
        out.className = 'output';
        history.appendChild(out);

        const formattedText = escapeHtml(text)
            .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        // Pętla do efektu maszyny do pisania z obsługą HTML
        let i = 0;
        let isTag = false;
        let tagBuffer = '';

        while (i < formattedText.length) {
            const char = formattedText.charAt(i);
            
            if (char === '<') {
                isTag = true;
            }

            if (isTag) {
                tagBuffer += char;
                if (char === '>') {
                    isTag = false;
                    out.innerHTML += tagBuffer;
                    tagBuffer = '';
                }
            } else {
                out.innerHTML += char;
                scrollToBottom();
                await sleep(TYPING_SPEED);
            }
            i++;
        }
        isTyping = false;
    }

    function printError(text) {
        const out = document.createElement('div');
        out.className = 'output error';
        out.textContent = text;
        history.appendChild(out);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function scrollToBottom() {
        content.scrollTop = content.scrollHeight;
    }

    content.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A' && !isTyping) {
            cli.focus();
        }
    });

    cli.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'c') {
            cli.value = '';
            e.preventDefault();
        }
    });

    // Uruchomienie animacji startowej
    runBootSequence();
</script>

</body>
</html>
