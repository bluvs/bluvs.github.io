<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bluvs@tty1:~</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        #terminal {
            max-width: 800px;
            margin: 0 auto;
        }

        .line {
            margin-bottom: 8px;
            word-break: break-word;
        }

        .prompt {
            color: #58a6ff;
        }

        .path {
            color: #3fb950;
        }

        .cmd {
            color: #f0f6fc;
            font-weight: bold;
        }

        .output {
            color: #8b949e;
            margin-top: 2px;
            white-space: pre-wrap;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        input {
            background: transparent;
            border: none;
            color: #f0f6fc;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            width: 100%;
            padding-left: 8px;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .ascii {
            color: #3fb950;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div id="terminal">
    <pre class="ascii">
  _     _                 
 | |__ | |_   ___   _____ 
 | '_ \| | | | \ \ / / __|
 | |_) | | |_| |\ V /\__ \
 |_.__/|_|\__,_| \_/ |___/
    </pre>

    <div class="line">Wpisz <span class="cmd">help</span>, aby zobaczyć listę dostępnych poleceń.</div>
    <div id="history"></div>

    <div class="input-line">
        <span class="prompt">bluvs@dev</span>:<span class="path">~</span>$&nbsp;
        <input type="text" id="cli" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script>
    const cli = document.getElementById('cli');
    const history = document.getElementById('history');

    const commands = {
        help: `Dostępne polecenia:
  about      - krótko o mnie
  skills     - technologie, których używam
  projects   - wybrane projekty
  socials    - linki i kontakt
  clear      - czyszczenie ekranu`,

        about: `Cześć, jestem bluvs.
Zajmuję się programowaniem i tworzeniem projektów open-source.
Lubię proste, wydajne rozwiązania i pracę w środowisku Linux.`,

        skills: `Technologie / Narzędzia:
  - Linux / Bash
  - Git / GitHub
  - JavaScript / TypeScript
  - Python / HTML & CSS`,

        projects: `Projekty:
  1. bluvs.is-a.dev - ta strona / portfolio
  2. [Dodaj swój projekt] - krótki opis projektu`,

        socials: `Kontakt / Linki:
  - GitHub: https://github.com/bluvs
  - Email: kontakt@example.com`
    };

    cli.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const input = this.value.trim();
            const cmd = input.toLowerCase();

            // Tworzenie linii z wpisaną komendą
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `<span class="prompt">bluvs@dev</span>:<span class="path">~</span>$ <span class="cmd">${escapeHtml(input)}</span>`;
            history.appendChild(line);

            // Obsługa komend
            if (cmd === 'clear') {
                history.innerHTML = '';
            } else if (cmd === '') {
                // Pusta linia, nic nie rób
            } else if (commands[cmd]) {
                const out = document.createElement('div');
                out.className = 'output';
                // Automatyczne zamienianie linków na klikalne URL-e
                out.innerHTML = escapeHtml(commands[cmd]).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
                history.appendChild(out);
            } else {
                const err = document.createElement('div');
                err.className = 'output';
                err.textContent = `bash: command not found: ${input}. Wpisz 'help'.`;
                history.appendChild(err);
            }

            this.value = '';
            window.scrollTo(0, document.body.scrollHeight);
        }
    });

    // Skupienie na wejściu przy kliknięciu w dowolne miejsce
    document.addEventListener('click', () => cli.focus());

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
