<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bluvs@tty1:~</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        #terminal {
            max-width: 800px;
            margin: 0 auto;
        }

        .line {
            margin-bottom: 8px;
            word-break: break-word;
        }

        .prompt {
            color: #58a6ff;
        }

        .path {
            color: #3fb950;
        }

        .cmd {
            color: #f0f6fc;
            font-weight: bold;
        }

        .output {
            color: #8b949e;
            margin-top: 2px;
            white-space: pre-wrap;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        input {
            background: transparent;
            border: none;
            color: #f0f6fc;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            width: 100%;
            padding-left: 8px;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .ascii {
            color: #3fb950;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div id="terminal">
    <pre class="ascii">
  _     _                 
 | |__ | |_   ___   _____ 
 | '_ \| | | | \ \ / / __|
 | |_) | | |_| |\ V /\__ \
 |_.__/|_|\__,_| \_/ |___/
    </pre>

    <div class="line">Wpisz <span class="cmd">ls</span>, aby wyświetlić pliki, lub <span class="cmd">help</span> dla pomocy.</div>
    <div id="history"></div>

    <div class="input-line">
        <span class="prompt">bluvs@dev</span>:<span class="path">~</span>$&nbsp;
        <input type="text" id="cli" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script>
    const cli = document.getElementById('cli');
    const history = document.getElementById('history');

    // Wirtualny system plików (TUTAJ EDYTUJ SWOJE DANE)
    const files = {
        'projects.txt': `PROJEKTY:
- bluvs.is-a.dev | Wizytówka/terminal w HTML/JS
- [Nazwa Projektu 2] | Krótki opis co ten projekt robi
- [Nazwa Projektu 3] | Opis kolejnego projektu`,

        'links.txt': `LINKI I KONTAKT:
- GitHub:  https://github.com/bluvs
- Email:   kontakt@example.com
- Discord: bluvs#0000`,

        'about.txt': `O MNIE:
Cześć, jestem bluvs.
Zajmuję się programowaniem oraz pracą z systemami Linux.
Lubię proste i wydajne rozwiązania.`,

        'skills.txt': `UMIEJĘTNOŚCI:
- Linux / Bash / Shell scripting
- Git / GitHub
- JavaScript / TypeScript
- HTML5 / CSS3 / Web Dev`
    };

    cli.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const rawInput = this.value.trim();
            const parts = rawInput.split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const arg = parts[1] ? parts[1].toLowerCase() : null;

            // Dodanie komendy do historii
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `<span class="prompt">bluvs@dev</span>:<span class="path">~</span>$ <span class="cmd">${escapeHtml(rawInput)}</span>`;
            history.appendChild(line);

            // Obsługa komend
            if (cmd === 'clear') {
                history.innerHTML = '';
            } else if (cmd === '') {
                // Puste wejście
            } else if (cmd === 'help') {
                printOutput(`Dostępne komendy:
  ls           - lista plików w katalogu
  cat <plik>   - wyświetl zawartość pliku (np. cat projects.txt)
  clear        - wyczyść ekran
  help         - pomoc`);
            } else if (cmd === 'ls') {
                const fileList = Object.keys(files).join('  ');
                printOutput(fileList);
            } else if (cmd === 'cat') {
                if (!arg) {
                    printOutput('cat: podaj nazwę pliku, np. "cat projects.txt"');
                } else if (files[arg]) {
                    printOutput(files[arg]);
                } else {
                    printOutput(`cat: ${arg}: No such file or directory`);
                }
            } else {
                printOutput(`bash: command not found: ${cmd}. Wpisz 'help' lub 'ls'.`);
            }

            this.value = '';
            window.scrollTo(0, document.body.scrollHeight);
        }
    });

    function printOutput(text) {
        const out = document.createElement('div');
        out.className = 'output';
        // Automatyczne podlinkowanie adresów URL
        out.innerHTML = escapeHtml(text).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        history.appendChild(out);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.addEventListener('click', () => cli.focus());
</script>

</body>
</html>
